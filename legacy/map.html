let selected=0;let completed={};try{completed=JSON.parse(localStorage.getItem('hronika_map_proto_v2')||'{}')}catch(e){}
const el=id=>document.getElementById(id);
function render(){el('pins').innerHTML=eras.map((e,i)=>`<button class="pin ${completed[i]?'done':''} ${i===selected?'selected':''}" style="left:${e.x}%;top:${e.y}%" onclick="selectEra(${i})" aria-label="${e.name}"><span class="num">${completed[i]?'✓':i+1}</span><strong>${e.name}</strong><small>${e.years}</small><em>${completed[i]?'✓ Проверено':'✦ Открыть эпоху'}</em></button>`).join('');let e=eras[selected];el('eraName').textContent=e.name+' · '+e.years;el('eraDescription').textContent=e.desc;el('eraStatus').textContent=completed[selected]?'✓ Проверка знаний пройдена':'Выбери действие: прочитать конспект или пройти проверку.';let count=Object.values(completed).filter(Boolean).length;el('progressText').textContent=`Проверено эпох: ${count} из ${eras.length}`;el('progressFill').style.width=count/eras.length*100+'%'}
function selectEra(i){selected=i;el('study').classList.add('hidden');render();if(innerWidth<650)el('eraName').scrollIntoView({block:'center',behavior:'smooth'})}
function showStudy(){let e=eras[selected];el('study').classList.remove('hidden');el('study').innerHTML=`<div class="eyebrow">📜 Краткий конспект</div><h2>${e.name}</h2><p>${e.desc}</p><div class="study-grid">${e.facts.map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div><p>Запомни основные даты и события, затем проверь себя.</p><button class="action" onclick="showQuiz()">⚔ Проверить знания →</button>`;el('study').scrollIntoView({block:'start',behavior:'smooth'})}
function showQuiz(){let e=eras[selected];el('study').classList.remove('hidden');el('study').innerHTML=`<div class="eyebrow">⚔ Испытание эпохи</div><h2>${e.name}</h2><p><b>${e.question}</b></p><div class="answers">${e.options.map((a,i)=>`<button class="answer" onclick="answer(${i})">${'АБВГ'[i]}. ${a}</button>`).join('')}</div><div class="result" id="result"></div>`;el('study').scrollIntoView({block:'start',behavior:'smooth'})}
function answer(i){let e=eras[selected],ok=i===e.correct;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===e.correct)b.classList.add('good');if(j===i&&!ok)b.classList.add('bad')});el('result').innerHTML=`<p>${ok?'✨ Верно! Эпоха отмечена как проверенная.':'❌ Пока неверно.'} ${e.explain}</p><button class="action secondary" onclick="showQuiz()">Повторить вопрос</button>`;if(ok){completed[selected]=true;try{localStorage.setItem('hronika_map_proto_v2',JSON.stringify(completed))}catch(e){}render()}}

let activeSection='map',studyTab='overview',quizIndex=0,quizAnswers=[],quizFinished=false,quizSet=[],quizSize=10,quizEra=0;
let mastery={};try{mastery=JSON.parse(localStorage.getItem('hronika_map_v4_mastery__'+(localStorage.getItem('chronika_active_profile_v1')||'default'))||'{}')}catch(e){}

function render(){const count=eras.filter((e,i)=>mastery[i]).length;el('pins').innerHTML=eras.map((e,i)=>`<button class="pin ${mastery[i]?'done':''} ${i===selected?'selected':''}" style="left:${e.x}%;top:${e.y}%" onclick="selectEra(${i})" aria-pressed="${i===selected}"><span class="num">${mastery[i]?'✓':i+1}</span><strong>${e.name}</strong><small>${e.years}</small><em>${mastery[i]?'✓ Освоено':i===selected?'◆ Выбрана эпоха':'✦ Выбрать'}</em></button>`).join('');let e=eras[selected];el('eraName').textContent=e.name+' · '+e.years;el('eraDescription').textContent=EXTRA[selected].lead;el('eraStatus').textContent=(mastery[selected]?'✓ Эпоха освоена. ':'')+'40 заданий в банке этой эпохи · 20 событий в хронологии';el('progressText').textContent=`Освоено эпох: ${count} из 6`;el('progressFill').style.width=count/6*100+'%';document.querySelector('header p').textContent='ТВОЁ ПУТЕШЕСТВИЕ ПО ИСТОРИИ РОССИИ · '+e.name.toUpperCase();setTheme()}
function selectEra(i){selected=i;render();if(activeSection==='study')showStudy(false);else if(activeSection==='quiz')startQuiz(false);else if(activeSection==='full')showFull(false);else el('study').classList.add('hidden')}
function openSection(section){activeSection=section;['map','study','quiz','full'].forEach(x=>el('nav-'+x).classList.toggle('active',x===section));el('mapArea').classList.toggle('hidden',section!=='map');el('eraPanel').classList.toggle('hidden',section!=='map');el('study').classList.add('hidden');el('fullNotes').classList.add('hidden');if(section==='study')showStudy(false);if(section==='quiz')startQuiz(false);if(section==='full')showFull(false)}

function showStudy(scroll=true){activeSection='study';['map','study','quiz','full'].forEach(x=>el('nav-'+x).classList.toggle('active',x==='study'));el('mapArea').classList.add('hidden');el('eraPanel').classList.add('hidden');el('fullNotes').classList.add('hidden');el('study').classList.remove('hidden');const e=eras[selected],x=EXTRA[selected];el('study').innerHTML=`<div class="eyebrow">📜 Конспект · ${e.years}</div><h2>${e.name}</h2><p class="study-lead">${highlight(x.lead)}</p><div class="study-tabs"><button onclick="studyTab='overview';showStudy(false)" class="${studyTab==='overview'?'active':''}">Обзор</button><button onclick="studyTab='chapters';showStudy(false)" class="${studyTab==='chapters'?'active':''}">Темы</button><button onclick="studyTab='dates';showStudy(false)" class="${studyTab==='dates'?'active':''}">Хронология (20 дат)</button></div><div id="studyBody"></div><div class="nextline"><button class="action secondary" onclick="openSection('full')">📚 Весь курс</button><button class="action" onclick="startQuiz()">Проверить знания →</button></div>`;let body='';if(studyTab==='overview')body=`<p class="study-para">${highlight(e.desc+' '+x.chapters.map(c=>c[1]).join(' '))}</p><h3>Ключевые даты</h3><div class="study-grid">${e.facts.map(f=>`<div class="fact"><b>${safe(f[0])}</b><span>${highlight(f[1])}</span></div>`).join('')}</div>`;if(studyTab==='chapters')body=`<div class="chapter-list">${x.chapters.map((c,i)=>`<div class="chapter"><b>${i+1}. ${safe(c[0])}</b><p>${highlight(c[1])}</p></div>`).join('')}</div>`;if(studyTab==='dates')body=`<div class="timeline">${CHRON_EVENTS[selected].map(f=>`<div class="timeline-item"><b>${safe(f[0])}</b><p>${highlight(f[1])}</p></div>`).join('')}</div>`;el('studyBody').innerHTML=body;if(scroll)el('study').scrollIntoView({block:'start',behavior:'smooth'})}
function showFull(scroll=true){activeSection='full';['map','study','quiz','full'].forEach(x=>el('nav-'+x).classList.toggle('active',x==='full'));el('mapArea').classList.add('hidden');el('eraPanel').classList.add('hidden');el('study').classList.add('hidden');el('fullNotes').classList.remove('hidden');el('fullNotes').innerHTML=`<div class="eyebrow">📚 Хроника ЕГЭ · Полный конспект</div><h2>История России: от Рюрика до наших дней</h2><p class="full-intro">Единый курс из шести периодов: <b>ключевые понятия</b>, события, правители, реформы и 120 опорных дат. Золотым выделены слова, которые важно узнавать в заданиях ЕГЭ. Материал — учебный обзор, не замена школьному учебнику и кодификатору ФИПИ.</p><input class="full-search" id="fullSearch" placeholder="Поиск по датам, личностям и терминам…" oninput="filterFull(this.value)" aria-label="Поиск по конспекту"><div class="full-toc">${eras.map((e,i)=>`<button onclick="document.getElementById('fullEra${i}').scrollIntoView({behavior:'smooth',block:'start'})">${safe(e.name)}</button>`).join('')}</div><div id="fullSections">${eras.map((e,i)=>`<article class="full-section" id="fullEra${i}" data-search="${safe((e.name+' '+e.years+' '+EXTRA[i].chapters.flat().join(' ')+' '+CHRON_EVENTS[i].flat().join(' ')).toLowerCase())}"><h3>${i+1}. ${safe(e.name)} · ${safe(e.years)}</h3><p class="study-lead">${highlight(EXTRA[i].lead)}</p>${EXTRA[i].chapters.map(c=>`<h4>${highlight(c[0])}</h4><p>${highlight(c[1])}</p>`).join('')}<h4>Опорные даты и события</h4>${CHRON_EVENTS[i].map(f=>`<div class="full-date"><b>${safe(f[0])}</b><span>${highlight(f[1])}</span></div>`).join('')}<div class="nextline"><button class="action secondary" onclick="selected=${i};render();studyTab='chapters';showStudy()">Мини-конспект</button><button class="action" onclick="selected=${i};render();startQuiz()">Проверить эпоху →</button></div></article>`).join('')}</div>`;if(scroll)el('fullNotes').scrollIntoView({block:'start',behavior:'smooth'})}
function filterFull(q){q=q.toLowerCase().trim();document.querySelectorAll('.full-section').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function bankForEra(i){const rows=CHRON_EVENTS[i],yearOpts=rows.map(x=>x[0]),eventOpts=rows.map(x=>x[1]);const bank=[];rows.forEach((r,k)=>{const wrongYears=shuffle(yearOpts.filter(y=>y!==r[0])).slice(0,3);const wrongEvents=shuffle(eventOpts.filter(y=>y!==r[1])).slice(0,3);let opts=shuffle([r[0],...wrongYears]);bank.push({q:'В каком году произошло событие: «'+r[1]+'»?',options:opts,correct:opts.indexOf(r[0]),explain:r[1]+' — '+r[0]+' г.'});opts=shuffle([r[1],...wrongEvents]);bank.push({q:'Какое событие относится к '+r[0]+' году?',options:opts,correct:opts.indexOf(r[1]),explain:r[0]+' г. — '+r[1]+'.'})});return bank}
function startQuiz(scroll=true){activeSection='quiz';['map','study','quiz','full'].forEach(x=>el('nav-'+x).classList.toggle('active',x==='quiz'));el('mapArea').classList.add('hidden');el('eraPanel').classList.add('hidden');el('fullNotes').classList.add('hidden');el('study').classList.remove('hidden');quizEra=selected;quizSet=shuffle(bankForEra(selected)).slice(0,quizSize);quizIndex=0;quizAnswers=[];quizFinished=false;renderQuestion();if(scroll)el('study').scrollIntoView({block:'start',behavior:'smooth'})}

const q=qs[quizIndex],given=quizAnswers[quizIndex],answered=given!==undefined;el('study').innerHTML=`<div class="eyebrow">⚔ Тренировка · ${safe(e.name)}</div><h2>Случайные задания</h2><div class="quiz-settings"><label for="quizCount">Вопросов за попытку:</label><select id="quizCount" onchange="quizSize=Number(this.value);startQuiz(false)"><option value="5" ${quizSize===5?'selected':''}>5</option><option value="10" ${quizSize===10?'selected':''}>10</option><option value="20" ${quizSize===20?'selected':''}>20</option></select><span class="question-hint">40 заданий в банке эпохи · порядок случайный</span></div><div class="quiz-meta"><span>Вопрос ${quizIndex+1} из ${qs.length}</span><span>Верных: ${quizAnswers.filter((a,i)=>a===qs[i].correct).length}</span></div><div class="quiz-track"><div style="width:${quizIndex/qs.length*100}%"></div></div><p class="study-lead"><b>${safe(q.q)}</b></p><div class="answers">${q.options.map((opt,i)=>`<button class="answer ${answered&&i===q.correct?'good':''} ${answered&&i===given&&given!==q.correct?'bad':''}" ${answered?'disabled':''} onclick="answer(${i})">${'АБВГ'[i]}. ${safe(opt)}</button>`).join('')}</div>${answered?`<div class="feedback ${given===q.correct?'':'bad'}">${given===q.correct?'✓ Верно!':'✕ Неверно.'} ${safe(q.explain)}</div><button class="action" onclick="nextQuestion()">${quizIndex===qs.length-1?'Завершить тренировку':'Следующий вопрос →'}</button>`:'<div class="result">Выбери ответ. Варианты перемешаны при создании задания.</div>'}<div class="nextline"><button class="action secondary" onclick="selected=quizEra;render();studyTab='dates';showStudy()">📜 Конспект</button><button class="action secondary" onclick="openSection('map')">🗺️ Карта</button></div>`}
function answer(i){if(quizAnswers[quizIndex]!==undefined)return;quizAnswers[quizIndex]=i;renderQuestion()}
function nextQuestion(){if(quizAnswers[quizIndex]===undefined)return;if(quizIndex===quizSet.length-1){quizFinished=true;const passed=quizAnswers.every((a,i)=>a===quizSet[i].correct);if(passed)mastery[quizEra]=true;try{localStorage.setItem('hronika_map_v4_mastery__'+(localStorage.getItem('chronika_active_profile_v1')||'default'),JSON.stringify(mastery))}catch(e){}render();renderQuestion()}else{quizIndex++;renderQuestion()}}
